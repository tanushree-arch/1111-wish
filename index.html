<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11:11 ♡</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="chat-page">

    <!-- Sky doodles -->
    <div class="sky-doodles" aria-hidden="true">
        <span class="cloud cloud-one">☁</span>
        <span class="cloud cloud-two">☁</span>
        <span class="sun">☀</span>
        <span class="moon">☾</span>
        <span class="star star-one">✦</span>
        <span class="star star-two">✧</span>
        <span class="star star-three">✦</span>
        <span class="star star-four">⋆</span>
    </div>

    <main class="chat-container">

        <a href="flowers.html" class="messages">

            <div class="message">
                <span>11:11</span>
                <span class="time">11:11 pm</span>
            </div>

            <div class="message message-wide">
                <span>Make a wish</span>
                <span class="time">11:11 pm</span>
            </div>

        </a>

    </main>

    <!-- Music -->
    <audio id="backgroundMusic" loop preload="auto">
        <source src="assets/invisible_string.mp3" type="audio/mpeg">
    </audio>

    <button id="musicToggle" class="music-button" aria-label="Play music">
        ♡ ♪
    </button>

    <script src="js/music.js"></script>

</body>
</html>
